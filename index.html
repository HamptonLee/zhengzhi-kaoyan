<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>政治真题速查 · 497 题</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">政</span>
      <div>
        <h1>政治真题速查</h1>
        <p class="brand-sub" id="brandSub">1994–2025 · 加载中…</p>
      </div>
    </div>
    <div class="top-right">
      <div class="top-actions">
        <button class="btn ghost" id="randomBtn" title="随机抽一题（R）">随机一题</button>
        <button class="btn ghost" id="wrongBtn" title="错题本">错题本 <span class="pill" id="wrongCount">0</span></button>
        <button class="btn ghost" id="reviewBtn" title="复习中心：错题与记忆程度汇总（V）">复习</button>
        <button class="btn ghost" id="paperBtn" title="一键组一套真题（16 单选 + 17 多选）">组套卷</button>
        <button class="btn ghost" id="statsBtn" title="统计">统计</button>
        <button class="btn ghost" id="resetBtn" title="二刷 / 重置">二刷·重置</button>
        <button class="btn" id="modeBtn" title="切换背题 / 自测（M）">自测模式</button>
      </div>

      <div class="corner" id="corner">
        <button class="chip-sync" id="syncChip" type="button" title="云同步状态" hidden>
          <i class="dot" id="syncDot"></i><span id="syncText">云同步</span>
        </button>
        <button class="chip-acct" id="acctChip" type="button" aria-haspopup="dialog" aria-expanded="false" title="账号">
          <span id="acctChipText">登录</span>
          <svg class="caret" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>

        <div class="acct-pop" id="acctPop" role="dialog" aria-label="账号与云同步" hidden>
          <header class="acct-pop-head">
            <div class="acct-pop-title">
              <b id="acctSub">账号与云同步</b>
            </div>
            <button class="pop-x" id="acctClose" type="button" aria-label="收起">✕</button>
          </header>
          <div class="acct-body" id="acctBody"></div>
        </div>
      </div>
    </div>
  </header>

  <section class="filters" id="filters">
    <div class="filter-row" id="subjectRow"></div>
    <div class="filter-row" id="partRow" hidden></div>
    <div class="filter-row main-row">
      <div class="segmented" id="typeRow"></div>
      <form class="jump" id="jumpForm" autocomplete="off">
        <label for="noInput">题号</label>
        <input id="noInput" inputmode="numeric" pattern="[0-9]*" placeholder="如 12" aria-label="题号">
        <button class="btn primary" type="submit">查询</button>
      </form>
      <div class="search">
        <input id="searchInput" placeholder="搜题干关键词 / 年份，如 剩余价值、2020" aria-label="搜索">
        <div class="suggest" id="suggest" hidden></div>
      </div>
    </div>
  </section>

  <div class="paper-bar" id="paperBar" hidden>
    <div class="paper-info"><b>真题套卷</b><span id="paperMeta"></span></div>
    <div class="paper-actions">
      <button class="btn primary" id="paperSubmit">交卷</button>
      <button class="btn ghost" id="paperQuit">退出套卷</button>
    </div>
  </div>

  <main class="layout">
    <section class="card" id="card" aria-live="polite"></section>
    <aside class="side">
      <div class="side-head">
        <span id="sideTitle">本题区题目</span>
        <span class="side-hint" id="sideHint"></span>
      </div>
      <div class="numgrid" id="numGrid"></div>
      <div class="legend">
        <span><i class="dot ok"></i>答对</span>
        <span><i class="dot bad"></i>答错</span>
        <span><i class="dot seen"></i>看过答案</span>
      </div>
    </aside>
  </main>

  <div class="ktoc" id="ktocPanel" hidden></div>

  <footer class="foot">
    <span>← → 切题/翻卡 · 1–4 选项 · Enter 提交/展开 · / 聚焦题号 · R 随机 · K 目录</span>
    <span id="progressText"></span>
  </footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-body" role="dialog" aria-modal="true">
    <header class="modal-head">
      <h2 id="modalTitle">错题本</h2>
      <button class="btn ghost" id="modalClose">关闭</button>
    </header>
    <div class="modal-content" id="modalContent"></div>
  </div>
</div>

<div class="rv-overlay" id="rvOverlay" hidden>
  <div class="rv-shell" role="dialog" aria-modal="true" aria-label="复习中心">
    <header class="rv-head">
      <div class="rv-heading">
        <h2>复习中心</h2>
        <p id="rvSub">加载中…</p>
      </div>
      <button class="btn ghost" id="rvClose">关闭</button>
    </header>
    <div class="rv-tools">
      <div class="rv-seg" id="rvRange">
        <button data-range="today" class="active">今天</button>
        <button data-range="7">近 7 天</button>
        <button data-range="30">近 30 天</button>
        <button data-range="all">全部</button>
      </div>
      <input type="date" id="rvDate" class="rv-date" aria-label="按日期筛选">
      <div class="rv-subjects" id="rvSubjects"></div>
    </div>
    <div class="rv-grid" id="rvGrid"></div>
    <div class="rv-body" id="rvBody"></div>
  </div>
</div>

<script src="data/questions.js"></script>
<script src="data/keywords.js"></script>
<script src="data/handbook.js"></script>
<script src="data/manual.js"></script>
<script src="data/auth-config.js"></script>
<script src="assets/app.js"></script>
<script src="assets/account.js"></script>
</body>
</html>
